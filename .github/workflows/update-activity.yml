name: Update activity feed

# Runs on every push to main, and once a day on a schedule so the
# portfolio stays current even when the site itself hasn't changed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"   # ~09:17 UTC daily — arbitrary, just off the hour
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch recent public activity
        env:
          # This is the short-lived, repo-scoped token GitHub Actions provides
          # automatically. It is never written into any file the site serves,
          # never present in browser JavaScript, and expires when the job ends.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 fetch_activity.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          git diff --staged --quiet && echo "no changes" || git commit -m "chore: refresh activity feed [automated]"
          git push
